<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>yoga feedback form</h1>

        <h3>Kindly give your Feedback!!</h3>

      <label>Name:</label>
        <input type="text" placeholder="Enter your name" required><br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your Email" required><br><br>

        <label>Age:</label>
        <input type="number" placeholder="enter age in number" required><br><br>

        <label>Gender:</label>
        <input type="radio" name="Gender">Male
        <input type="radio" name="Gender">Female<br><br>

        <label>batch:</label>
        <select>
            <option>morning</option>
            <option>Afternoon</option>
            <option>Evening</option>
        </select><br><br>

        <label>Rate your Experience:</label>
        <input type="radio" name="gender">Excellent
        <input type="radio" name="gender">Good
        <input type="radio" name="gender">Average
        <input type="radio" name="gender">bad<br><br>

        <label>Feedback:</label><br>
        <textarea rows="6" cols="50"></textarea><br><br>

        <input type="submit" value="Submit form"
     </form>
</body>
</html>
